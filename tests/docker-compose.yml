version: "3.8"

services:
  test-runner:
    build:
      context: ..
      dockerfile: Dockerfile.test
    environment:
      # PATH 劫持：mock/ 在最前面，docker/smartctl 优先走 mock
      - PATH=/mock:/scripts:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      # /var/local/emhttp/var.ini 在容器中不存在，通过环境变量指定 mock 路径
      - VAR_INI_MOCK=/mock/var.ini
      # 标记测试环境，脚本可据此做环境判断
      - SAGE_TEST_ENV=1
    command: >
      sh -c "
        echo '=== Running all tests ===' &&
        failures=0 &&
        for t in /tests/test_*.sh; do
          echo '--- Running: ' \$$(basename \"\$$t\") ' ---';
          if bash \$$t 2>&1; then
            echo 'PASS: ' \$$(basename \"\$$t\");
          else
            echo 'FAIL: ' \$$(basename \"\$$t\");
            failures=\$$((failures + 1));
          fi;
          echo '';
        done;
        echo '=== Done ===' &&
        total=\$$(ls /tests/test_*.sh 2>/dev/null | wc -l) &&
        echo \"Result: \$$((total - failures))/\$$total passed, \$$failures failed\" &&
        exit \$$failures;
      "
