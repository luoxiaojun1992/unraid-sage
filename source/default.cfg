# Unraid Sage - Default Configuration
# API Settings
API_ENDPOINT="http://localhost:11434/v1/chat/completions"
API_KEY=""
MODEL="qwen2.5:7b"

# Schedule (cron expression)
# Default: every 6 hours
CRON_EXPR="0 */6 * * *"

# Historical advice cache retention
# Number of past advice records to keep on persistent storage.
# Set to 0 to disable historical caching entirely.
# Cleanup runs only when new advice is saved (no extra I/O cycles).
MAX_HISTORY="30"

# Feature toggle
ENABLED="true"
